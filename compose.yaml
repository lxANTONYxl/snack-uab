services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snack
      POSTGRES_PASSWORD: snack_local_only
      POSTGRES_DB: snack_uab
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - snack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snack -d snack_uab"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  snack_pgdata:
